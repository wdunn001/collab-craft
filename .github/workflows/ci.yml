name: CI

# Format, lint, test and the feature-gated example, on every push and PR.
# Mirrors .forgejo/workflows/ci.yml so the checks are visible on GitHub too.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup component add rustfmt clippy
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libssl-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: feature-gated example
        run: cargo build -p craft-collab --example join --features native-hub
