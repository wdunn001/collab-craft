[package]
name = "craft-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "How a Craft app talks to CollabCraft: sign in, browse, open, save, share. No provider credential and no provider protocol"

[lints]
workspace = true

[dependencies]
craft-cloud = { workspace = true }
craft-esign = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The desktop transport. Blocking, because the apps calling this are not async.
#
# platform-verifier, because a CollabCraft behind an internally signed
# certificate is the normal case and ureq defaults to Mozilla's roots only.
# That default fails with "invalid peer certificate: UnknownIssuer", which
# names neither the certificate nor the store it was missing from. The platform
# verifier reads the operating system's own trust store, so a CA already
# enrolled on the machine works with nothing shipped in the binary.
#
# Enabling the native-tls feature alone would not have helped: the provider
# still has to be selected, and it defaults to rustls either way.
#
# Gated on the target and never on a feature. ureq reaches getrandom 0.2, which
# refuses to compile for wasm32-unknown-unknown at all, and a feature flag
# leaves the dependency in the graph of every build that resolves the manifest.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["platform-verifier"] }

# The browser transport. The page's own fetch, through the bindings the browser
# already has. No certificate store and no root list here: the browser settled
# which certificates it trusts before the page loaded.
#
# craft-collab is here and not above because of `invite`, which is the whole of
# what a browser build does when somebody with no account follows a share. The
# service answers that in one call: the document, the permission, the room and
# the relay token. Joining the room is therefore part of the same flow, and
# leaving the socket out would have each of the twelve apps assemble it again.
# A desktop build never follows that path, so it carries none of this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
craft-collab = { workspace = true, features = ["web-hub"] }
js-sys = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "AbortController",
  "AbortSignal",
  "Document",
  "Element",
  "Headers",
  "HtmlElement",
  "Location",
  "Node",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "Response",
  "Window",
] }
