[workspace]
members = [".", "crates/nextcloud", "crates/collab", "crates/cloud-client", "crates/share-backend"]

# What the moved crates inherit. They were written against a workspace root
# and they keep working against this one.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# The same terms the repository ships and the README states, and the same ones
# the Craft applications use. These crates exist to be linked by those
# applications. A copyleft licence here would reach every one of them.
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/collab-craft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The contracts come from craft-libs, pinned once for the whole workspace.
# Everything that reaches a wire lives here, beside the service that calls it.
#
# Both craft-libs crates are pinned to the same revision deliberately.
# craft-ui speaks the craft-cloud vocabulary, so two revisions put two
# `Permission` types in one binary and nothing can be passed between them.
[workspace.dependencies]
craft-cloud = { git = "https://github.com/wdunn001/craft-libs", rev = "1d4ffc10b0714ebc113e9301a84ac59476e4a27e" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "289d562cc6e8b567819aee51f759a78f41a65454" }
craft-collab = { path = "crates/collab" }
craft-cloud-client = { path = "crates/cloud-client" }
craft-nextcloud = { path = "crates/nextcloud" }
collabcraft-share = { path = "crates/share-backend" }
# The browser bindings, pinned here so the client, the share adapter and
# the browser hub cannot end up on three different versions of them.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
log = "0.4"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "collabcraft-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "The CollabCraft relay: verifies Nextcloud-issued tokens, orders document edits and arbitrates scope locks"
repository = "https://github.com/storytold/collab-craft"

[[bin]]
name = "collabcraft-relay"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
axum = "0.8"
craft-cloud = { workspace = true }
craft-nextcloud = { workspace = true }
# The identity provider and the cloud provider are both reached over HTTP. The
# blocking client is for the provider contracts, which are synchronous and run
# on a blocking thread.
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Static hosting for the browser builds, so one service answers everything.
# ServiceExt::oneshot, to hand a request to the static service after the
# permission check has passed.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
# Session ids and CSRF state come from the operating system, never a seeded PRNG.
getrandom = "0.3"
base64 = "0.23"
hmac = "0.13"
# The bus. Valkey speaks the Redis protocol, so this client works unchanged.
redis = { version = "1", features = ["tokio-comp", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# extensions and state are opt-in in 0.18. Without them SocketRef has no
# `.extensions` field and `extract::State` does not exist.
socketioxide = { version = "0.18", features = ["extensions", "state", "tracing"] }
# Room fanout across relay instances, over the same Valkey. No new queue.
socketioxide-redis = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
